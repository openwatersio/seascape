name: Build

# Runs the build against the persistent store volume as TWO Snakemake invocations over ONE DAG,
# one per ephemeral box (build-phase.yml holds the boot/attach/teardown machinery):
#
#   build-wide — the dispatched server_type (ccx63 for a planet run), target `prebundle`: the
#     `cover` checkpoint, then every parallel job (merges → forks → terrain renders → per-cell
#     vector archives → mosaic index). This is the whole DAG except its serial finish.
#   build-tail — a ccx33, targets `bundles publish_mosaic stage_build vector_selfcheck`: the
#     singleton tippecanoe/pmtiles-merge/upload rules, which are serial and IO-bound and would
#     otherwise hold the big box idle for hours. The wide phase's outputs re-plan as current at
#     the invocation boundary, so this replans to exactly the tail.
#
# `needs: build-wide` is the failure gate — a red wide phase skips the tail entirely — and, since
# a called workflow completes only once its own teardown job has, it is also the volume handoff:
# the tail cannot attach until the wide box is gone.
#
# No fetch runs: every source byte streams from R2 via /vsicurl (SOURCE_VSI_BASE), and cover is
# up-to-date on a warm volume, so its stage-1 producers never fire.
#
# Every job runs isolated with a benchmark: directive, so per-tile max-RSS lands in the box's
# local-disk scratch (TMP) and ships as a per-phase artifact. Tiles are plain-named on the volume;
# publish_mosaic content-addresses them to R2 under hashed names with a CANDIDATE pointer
# (index + gti) — the serving pointer mosaic.gti is never written from here, so serving state is
# structurally untouchable.
#
# A warm volume is assumed: the fetch/prep rules now live in the same graph, so a MISSING
# registration would let cover cascade into them. The step guards refuse a blank volume / absent
# covering — run sources.yml first. A bbox smoke before the first full planet dispatch is the
# intended path.

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Bounding box "W,S,E,N" (empty = full planet)'
        required: false
        default: ""
      depare:
        description: "Build the DEPARE depth-area layer (default on). Uncheck for a raster-only build (sets SKIP_DEPARE=1)."
        type: boolean
        default: true
      force:
        description: "Force: -F on the build invocation (code changes are force-only by design)"
        type: boolean
        default: false
      server_type:
        description: "Hetzner type for the WIDE phase — ccx33 (8/32) fits incremental builds; pick ccx63 (48/192) for wide runs (cold builds, big invalidations). The bundle tail always runs on a ccx33."
        required: false
        default: ccx33
      snakemake_args:
        description: "Extra snakemake args, e.g. -R publish (code changes are force-only)"
        required: false
        default: ""
      max_jobs:
        description: "Scope gate on the WIDE phase: dry-run first and abort if the planned job count exceeds this or is zero (empty = no gate). State the expected DAG size here so a planner surprise dies in minutes, not on box time."
        required: false
        default: ""
      targets:
        description: "Snakemake targets (empty = the standard two-phase build). Naming targets, e.g. soundings_all for an isolated leaf-product rebuild that must not cascade, runs them WHOLE on the dispatched server_type with no bundle tail."
        required: false
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository }}

# One store-mutating workflow at a time, globally: builds, sources runs, and GC share this
# group, and a run-level group covers every job of a called workflow — so both phases of a build
# hold it. NOTE: a second queued dispatch EVICTS the first — one dispatch at a time.
concurrency:
  group: r2-store
  cancel-in-progress: false

jobs:
  # Ensure the deps-only toolchain image exists (shared with ci.yml/sources.yml).
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ghcr-login
      - name: Already in GHCR?
        id: have
        run: |
          if docker manifest inspect "$IMAGE:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "image current: $IMAGE:$IMAGE_TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.exists != 'true'
      - uses: docker/build-push-action@v6
        if: steps.have.outputs.exists != 'true'
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-wide:
    needs: image
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    permissions: { contents: read, packages: read, statuses: write }
    with:
      phase: wide
      server_type: ${{ inputs.server_type }}
      # A named target set has no bundle tail to hand off, and a bbox slice is small enough that a
      # second boot costs more than the box-size delta saves — both run the whole thing here.
      targets: ${{ inputs.targets != '' && inputs.targets || (inputs.bbox != '' && 'bundles publish_mosaic stage_build vector_selfcheck' || 'prebundle') }}
      final: ${{ inputs.targets != '' || inputs.bbox != '' }}
      bbox: ${{ inputs.bbox }}
      depare: ${{ inputs.depare }}
      force: ${{ inputs.force }}
      snakemake_args: ${{ inputs.snakemake_args }}
      max_jobs: ${{ inputs.max_jobs }}

  build-tail:
    needs: [image, build-wide]
    if: ${{ inputs.targets == '' && inputs.bbox == '' }}
    uses: ./.github/workflows/build-phase.yml
    secrets: inherit
    permissions: { contents: read, packages: read, statuses: write }
    with:
      phase: tail
      # The tail is serial and IO-bound (one tippecanoe run, pmtiles concats, R2 uploads); cores
      # and RAM past a ccx33 buy it nothing.
      server_type: ccx33
      targets: bundles publish_mosaic stage_build vector_selfcheck
      final: true
      bbox: ${{ inputs.bbox }}
      depare: ${{ inputs.depare }}
      force: ${{ inputs.force }}
      snakemake_args: ${{ inputs.snakemake_args }}
      # A job-count gate needs a number nobody can state (the overlay-cell count moves with the
      # covering); the rule allowlist is the sharper guard — it fails on WHAT would run, not how
      # much. `cover` is deliberately absent: a tail plan that reschedules the checkpoint hides
      # its real size behind it, and that is exactly the case to refuse.
      allow_rules: bundles overlay_bundle publish_mosaic stage_build terrain_planet_bundle vector_join vector_selfcheck vector_shallow
