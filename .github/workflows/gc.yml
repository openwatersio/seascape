name: GC

# Out-of-band garbage collection for the data bucket's bathymetry prefix. Deletion is done HERE
# and nowhere else: a build only ever ADDS content-addressed mosaic objects + a candidate pointer,
# and release.yml promotes a candidate by copying it over mosaic.gti — so superseded objects
# accumulate as unreferenced garbage that this collects.
#
# The referenced set is rooted on the published mosaic: the serving pointer mosaic.gti (its index
# parquet + planet-z8 overview + every tile the index names) plus every candidate still named by a
# live build/<sha>/manifest.json (promotable until the build/ lifecycle rule expires it — 7 days).
#
# Deletes:
#   - everything else under mosaic/ — superseded tiles/overviews, old candidate GTIs + indexes
#   - the retired store-hydrate prefixes wholesale: pmtiles/ contour/ soundings/ depare/
#     aggregation/ store/ (dead since the store moved to the persistent build volume)
#   - retired source/<id>/bounds.csv registrations (catalog.json carries the per-file rows as
#     seascape:files now — sources.yml)
# NEVER touches: build/<sha>/ (read-only roots here; an R2 lifecycle rule collects it after 7
# days — see release.yml — and releases live in the separate tiles bucket), source COGs /
# catalog.json / polygon/ / landmask/ (sources.yml owns them).
#
# Guards: refuse to delete anything unless the serving pointer, its index, and every object they
# reference resolve against the actual listing (a mismatch must never delete the world); log a
# full inventory before deleting; delete in bounded batches. Shares build.yml/sources.yml's
# r2-store concurrency group, so it can never run during a build or a source refresh.
#
# The referenced-set arithmetic + every refusal guard live in scripts/gc-collect.sh — ONE
# implementation, invoked here with the rclone backend and by pipelines/test_gc.sh with the local
# backend (ci.yml runs the test on every push), so this workflow and its test cannot drift.

on:
  schedule:
    - cron: "17 4 * * 2" # weekly Tuesday 04:17 UTC — a day off sources.yml (Mon) and no build overlap
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting (manual runs default to a dry run; the weekly cron always deletes)"
        type: boolean
        default: true

env:
  DATA_BUCKET: data # the public data bucket (data.openwaters.io), bathymetry/ store
  # rclone reads these for the R2 remote (same pattern as release.yml).
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  # schedule → always delete; manual dispatch → honor the dry_run input (default true).
  DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}

# The store is shared: GC deletes, a build/source-refresh writes, so they must never interleave —
# ONE concurrency group with build.yml and sources.yml. No cancel-in-progress: queue, never cancel.
concurrency:
  group: r2-store
  cancel-in-progress: false

jobs:
  gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # for scripts/gc-collect.sh

      - name: Install pinned rclone
        run: |
          set -euo pipefail
          # Pinned, sha256-verified rclone 1.74.4 — apt's 1.60.1 501s on R2's version-id responses
          # (same pin as build.yml/sources.yml/release.yml). jq is preinstalled on the runner.
          curl -fsSL -o /tmp/rclone.zip "https://downloads.rclone.org/v1.74.4/rclone-v1.74.4-linux-amd64.zip"
          echo "fe435e0c36228e7c2f116a8701f01127bb1f694005fc11d1f27186c8bca4115d  /tmp/rclone.zip" | sha256sum -c
          unzip -q -j /tmp/rclone.zip '*/rclone' -d /tmp/rclone-bin
          sudo install /tmp/rclone-bin/rclone /usr/local/bin/rclone

      - name: Install pyarrow (the mosaic index is GeoParquet)
        run: python3 -m pip install --quiet pyarrow

      - name: Collect + delete
        run: |
          set -euo pipefail
          R2="R2:$DATA_BUCKET/bathymetry"
          echo "GC dry_run=$DRY_RUN"

          # The referenced-set arithmetic, refusal guards, and inventory all live in
          # scripts/gc-collect.sh (one implementation, shared with pipelines/test_gc.sh — see the
          # header comment). It writes /tmp/gc-delete.txt + /tmp/gc-purge-dirs.txt and exits
          # nonzero on any refusal; a pre-mosaic store (no pointer) yields empty outputs.
          bash scripts/gc-collect.sh rclone "$R2"
          del=$(grep -c . /tmp/gc-delete.txt || true)
          dirs=$(grep -c . /tmp/gc-purge-dirs.txt || true)

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run — nothing deleted ($del objects + $dirs retired prefix(es) flagged). Re-dispatch with dry_run=false (or wait for the weekly cron) to collect."
            exit 0
          fi

          # Delete in bounded batches (files via --files-from, retired prefixes via purge).
          if [ "$del" -gt 0 ]; then
            split -l 1000 -d /tmp/gc-delete.txt /tmp/gc-batch-
            for b in /tmp/gc-batch-*; do
              echo "deleting $(wc -l < "$b") objects"
              rclone delete "$R2" --files-from "$b"
            done
          fi
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            echo "purging retired prefix $d/"
            rclone purge "$R2/$d"
          done < /tmp/gc-purge-dirs.txt
          echo "GC complete: deleted $del objects + purged $dirs retired prefix(es)"
